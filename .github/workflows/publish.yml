name: Publish

on:
  push:
    tags:
      - 'v*'

# id-token: write enables npm Trusted Publishing (OIDC) — no NPM_TOKEN secret is
# stored; npm verifies the GitHub OIDC token against the package's configured
# trusted publisher and attaches provenance automatically.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  test:
    name: Tests
    needs: verify
    uses: ./.github/workflows/tests.yml

  publish:
    name: Publish To npm
    runs-on: ubuntu-latest
    needs:
      - verify
      - test
    # `release` is a protected GitHub Environment. Create it in the repository
    # settings and configure required reviewers (the release maintainers) before
    # the first tag, so that a person must approve every npm publish. GitHub
    # creates a missing environment without protection rules.
    environment: release

    steps:
      # Only the GitHub logins listed in the repository variable
      # vars.DEPLOYER_LOGINS (comma-separated) may publish to npm. If the
      # variable is empty, this step fails and nothing is published.
      - name: Authorize actor
        env:
          ALLOWED: ${{ vars.DEPLOYER_LOGINS }}
        run: |
          if ! printf '%s' "$ALLOWED" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -Fxq "${{ github.actor }}"; then
            echo "::error::${{ github.actor }} is not in vars.DEPLOYER_LOGINS; only the logins listed there may publish to npm."
            exit 1
          fi
          echo "✅ ${{ github.actor }} authorized"

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Repository
        uses: ./.github/actions/setup

      - name: Check Tag Matches Package Version
        run: |
          VERSION="$(node -p "require('./packages/client/package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match @renaiss-protocol/client version $VERSION. Merge the release candidate PR (or bump the version) before tagging."
            exit 1
          fi

      - name: Build
        run: pnpm build

      # The dist-tag comes from the version's prerelease identifier:
      # 0.2.0-alpha.0 → alpha, 1.0.0-beta.2 → beta, 1.0.0 → latest.
      - name: Publish
        run: |
          VERSION="$(node -p "require('./packages/client/package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG="${VERSION#*-}"; DIST_TAG="${DIST_TAG%%.*}" ;;
            *) DIST_TAG="latest" ;;
          esac
          echo "Publishing @renaiss-protocol/client@$VERSION with dist-tag $DIST_TAG"
          pnpm --filter @renaiss-protocol/client publish --tag "$DIST_TAG" --no-git-checks
