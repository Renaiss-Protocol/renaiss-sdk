name: Release

on:
  push:
    branches:
      - main

# Versioned releases are published by publish.yml when a v* tag is pushed; this
# workflow only maintains the release candidate PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  test:
    name: Tests
    needs: verify
    uses: ./.github/workflows/tests.yml

  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    needs:
      - verify
      - test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Repository
        uses: ./.github/actions/setup

      # Maintains the release candidate PR only. Publishing happens in
      # publish.yml when the matching v* tag is pushed.
      - name: Create Or Update Release PR
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1
        with:
          version: pnpm version:bump
          title: '[Release] Candidate'
          commit: 'chore: bumps package versions'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
